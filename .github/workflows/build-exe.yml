name: Build Windows exe

on:
  push:
    branches: [ccr-0d25fca9-vg5vzp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # vgamepad's setup.py would otherwise open the ViGEmBus installer and hang the build.
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check imports and bundled ViGEmBus installer
        # importing vgamepad itself needs the driver, which CI runners do not have
        run: python -c "import mcd_loader.overlay, mcd_loader.wasd as w; p = w.driver_installer(); print(p); assert p"

      - name: Build Launcher.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Launcher --icon mcd_loader/assets/launcher.ico --collect-data mcd_loader --collect-all vgamepad --hidden-import PIL._tkinter_finder launcher.py

      - name: Check bundled assets
        shell: bash
        run: python -c "import sys; d=open('dist/Launcher.exe','rb').read(); [sys.exit('missing ' + n) for n in ('logo.png', 'launcher.ico', 'ViGEmBusSetup_x64.msi') if n.encode() not in d]"

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: dist/Launcher.exe

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Launcher.exe \
            --target "${{ github.sha }}" \
            --title "MCD Loader — последняя сборка" \
            --notes "Сборка из коммита ${{ github.sha }}. Скачайте Launcher.exe и запустите. Windows может показать предупреждение SmartScreen (файл не подписан): «Подробнее» → «Выполнить в любом случае»."
